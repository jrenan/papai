<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcfaf2">
  <title>Jardim das somas · Trio do Saber</title>
  <link rel="icon" href="../assets/trio-do-saber.png">
  <link rel="stylesheet" href="../numberblocks-somar/numberblocks.css">
  <link rel="stylesheet" href="garden.css">
  <script defer src="../numberblocks-somar/numberblocks.js"></script>
  <script defer src="journey.js"></script>
  <script defer src="garden.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="leaf" viewBox="0 0 32 32"><path d="M16 28V16m0 6C7 22 4 17 4 11c8 0 12 3 12 9m0-4C16 8 20 4 28 4c0 8-4 12-12 12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="switch" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <header class="topbar frame">
    <a class="home-link" href="../index.html"><svg class="icon"><use href="#back"/></svg> Trio do Saber</a>
    <nav aria-label="Família">
      <button type="button" class="person" data-view="profiles"><span id="profile-avatar"></span><span id="profile-name">Quem joga?</span><svg class="icon chevron"><use href="#switch"/></svg></button>
      <button type="button" class="parents-link" data-view="family"><svg class="icon"><use href="#user"/></svg> Para os pais</button>
    </nav>
  </header>
  <main class="frame">
    <section class="garden" aria-labelledby="garden-title">
      <div class="garden-copy">
        <h1 id="garden-title">Jardim<br> das somas<span>.</span></h1>
        <p id="welcome">Junte os Numberblocks e descubra quem aparece quando dois amigos viram um só.</p>
        <a id="play" class="primary" href="../numberblocks-somar/index.html?trilha=1">Começar a brincar <svg class="icon"><use href="#arrow"/></svg></a>
        <small id="save-note" role="status"></small>
      </div>
      <div class="meadow" aria-hidden="true">
        <div class="friends"><span data-number="1"></span><span data-number="2"></span><span data-number="3"></span></div>
      </div>
    </section>
    <section class="trail" aria-labelledby="trail-title">
      <header><h2 id="trail-title">As paradas do jardim</h2><span>2 jogos</span></header>
      <div class="stops">
        <a id="friends-stop" class="stop" href="../numberblocks-somar/index.html?trilha=1">
          <span class="stamp sprout" aria-hidden="true"><svg><use href="#leaf"/></svg></span>
          <span class="stop-copy"><small>Parada 1</small><strong>Juntar e Somar</strong><span>Monte os amigos e conte até 20.</span></span>
          <svg class="icon stop-arrow"><use href="#arrow"/></svg>
        </a>
        <a id="blocks-stop" class="stop" href="../numberblocks-1-100/blocos-de-somar.html?trilha=1">
          <span class="stamp bloom" aria-hidden="true"><svg viewBox="0 0 40 40"><g fill="#ffb956" stroke="#754423" stroke-width="1.7"><ellipse cx="20" cy="12" rx="5" ry="8"/><ellipse cx="20" cy="28" rx="5" ry="8"/><ellipse cx="12" cy="20" rx="8" ry="5"/><ellipse cx="28" cy="20" rx="8" ry="5"/><circle cx="20" cy="20" r="5" fill="#ffdf6b"/></g></svg></span>
          <span class="stop-copy"><small>Parada 2</small><strong>Blocos de Somar</strong><span>Junte dezenas e chegue até 100.</span></span>
          <svg class="icon stop-arrow"><use href="#arrow"/></svg>
        </a>
      </div>
    </section>
  </main>
  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-head"><span class="small-mark" aria-hidden="true"><svg><use href="#leaf"/></svg></span>
      <button type="button" class="icon-btn" data-action="close" aria-label="Fechar"><svg class="icon"><use href="#close"/></svg></button></div>
    <div id="panel-body"></div>
  </dialog>
</body>
</html>
