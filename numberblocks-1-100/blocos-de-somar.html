<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blocos de Somar · Trio do Saber</title>
<meta name="theme-color" content="#2E5A4D">
<meta name="description" content="Aprenda a somar arrastando blocos de dezenas e unidades. Um jogo do Trio do Saber.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: quadro verde (chalkboard) as the ground; each work area is a sheet of papel quadriculado
   laid out as a Quadro Valor de Lugar (D | U). Every piece is sized from --s; fit() tries a few grid
   arrangements per screen (wide, stacked for phone portrait, side-by-side for phone landscape) and keeps
   the one that gives the biggest cubes with no scrolling. */
:root{
  --board:#2E5A4D; --board-deep:#23493E; --chalk:#F3F6EF; --chalk-soft:rgba(243,246,239,.74); --chalk-faint:rgba(243,246,239,.12);
  --paper:#FFFDF6; --grid:#DCE8F1; --grid-strong:#B7CEDF; --ink:#1E2B33; --ink-soft:#5A6A73;
  --blue:#2F6FEB; --blue-d:#1C4DB3; --orange:#FF8A1F; --orange-d:#C7620A;
  --sun:#FFD447; --sun-d:#D6A612; --ok:#2FBF71; --ok-d:#1D8A4F; --no:#EF5B57; --no-d:#B83B38;
  --rim:rgba(30,43,51,.55);
  --f-display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS',system-ui,sans-serif;
  --s:34px; --st:26px;
  color-scheme:dark;
}
html{height:100%; box-sizing:border-box}
body{
  height:100%; margin:0; color:var(--chalk); font-family:var(--f-body); font-size:16px;
  background:
    radial-gradient(ellipse 60% 40% at 18% 8%, rgba(255,255,255,.07), transparent 70%),
    radial-gradient(ellipse 50% 35% at 85% 92%, rgba(255,255,255,.05), transparent 70%),
    var(--board);
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
#app{height:100%; display:flex; flex-direction:column}
button{font-family:inherit}
button:focus-visible,[data-drag]:focus-visible{outline:3px solid var(--sun); outline-offset:3px}

/* ---------- top bar ---------- */
#top{display:flex; align-items:center; gap:12px; padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background:var(--board-deep); border-bottom:3px solid rgba(0,0,0,.14); flex-wrap:nowrap; min-height:64px; box-sizing:border-box; flex:none}
.brand{font:800 1.4rem/1 var(--f-display); letter-spacing:.01em; padding-top:3px; white-space:nowrap}
.steps{display:flex; gap:6px; list-style:none; margin:0 auto; padding:0}
.steps li{display:flex; align-items:center; gap:7px; padding:5px 13px 5px 5px; border-radius:999px; background:var(--chalk-faint); color:var(--chalk-soft); font:700 1rem/1 var(--f-display)}
.steps li b{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.14); color:var(--chalk); padding-top:2px; box-sizing:border-box}
.steps li span{padding-top:2px}
.steps li i{width:10px; height:10px; border-radius:3px; display:inline-block}
.steps li.now{background:var(--chalk); color:var(--ink)}
.steps li.now b{background:var(--sun); color:var(--ink)}
.steps li.done b{background:var(--ok); color:#fff}
.tools{display:flex; gap:8px; align-items:center; margin-left:auto}
.ib{height:44px; min-width:44px; border-radius:12px; border:0; background:var(--chalk-faint); color:var(--chalk); display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; padding:0 10px; font:800 1.05rem/1 var(--f-display)}
.ib svg{width:24px; height:24px; fill:currentColor; flex:none}
.ib.say{background:var(--sun); color:var(--ink); box-shadow:0 3px 0 var(--sun-d); padding:0 14px}
.ib.say span{padding-top:3px}
.stars{display:inline-flex; align-items:center; gap:5px; font:800 1.3rem/1 var(--f-display); color:var(--sun); padding:0 6px}
.stars svg{width:24px; height:24px; fill:var(--sun)}
.stars b{padding-top:3px}
@media (max-width:860px){ .steps li span,.steps li i{display:none} .steps li{padding:5px} }
@media (max-width:620px){ .brand{display:none} .ib.say span{display:none} .ib.say{padding:0 10px} }

/* ---------- stage ---------- */
#stage.clip{overflow:hidden}
#stage{flex:1; min-height:0; overflow:auto; display:flex; padding:14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); box-sizing:border-box; touch-action:manipulation}
.scene{margin:auto; display:grid; gap:calc(var(--s)*.45) calc(var(--s)*.9); justify-items:center; align-items:center}
figure{margin:0}
.fig{display:flex; flex-direction:column; align-items:center; gap:8px}
.fig-cap{display:flex; align-items:center; gap:8px; min-height:40px}

/* grid areas */
.a-target{grid-area:target} .a-bub{grid-area:bub} .a-tray{grid-area:tray} .a-mat{grid-area:mat} .a-btn{grid-area:btn}
.a-a{grid-area:a} .a-b{grid-area:b} .a-plus{grid-area:plus} .a-j{grid-area:j} .a-panel{grid-area:panel} .a-eq{grid-area:eq}
.a-bub{justify-self:stretch; min-width:min(340px, calc(100vw - 40px))}
.build[data-l="wide"]{grid-template-areas:"target bub" "tray mat" ". btn"}
.build[data-l="wide"] .a-tray{align-self:end}
.build[data-l="stack"]{grid-template-areas:"target" "bub" "tray" "mat" "btn"}
.build[data-l="side3"]{grid-template-areas:"tray mat target" "tray mat bub" "tray mat btn"}
.build[data-l="side3"] .a-tray{align-self:end}
.build[data-l="side3"] .a-bub,.join[data-l="side"] .a-bub{min-width:230px; width:230px}
.join[data-l="row"]{grid-template-areas:"bub bub bub" "a plus b"}
.join[data-l="col"],.join[data-l="colL"]{grid-template-areas:"bub" "a" "b"; row-gap:calc(var(--s)*.35)}
.join[data-l="side"]{grid-template-areas:"a plus b bub"}
.count[data-l="row"],.count[data-l="rowW"]{grid-template-areas:"j panel"}
.count[data-l="stack"],.count[data-l="stackL"]{grid-template-areas:"j" "panel"}
.sum[data-l="row"]{grid-template-areas:"j eq"}
.sum[data-l="stack"],.sum[data-l="stackL"]{grid-template-areas:"j" "eq"}
[data-l="colL"] .fig,[data-l="stackL"] .fig{flex-direction:row}
[data-l="colL"] .fig-cap,[data-l="stackL"] .fig-cap{flex-direction:column}
[data-l="col"] .a-plus,[data-l="colL"] .a-plus{display:none}
.pl{display:none; font:800 1.6rem/1 var(--f-display); color:var(--chalk)}
[data-l="col"] .pl,[data-l="colL"] .pl{display:inline}

/* ---------- blocks ---------- */
.cube{display:block; width:var(--s); height:var(--s); box-sizing:border-box; background:var(--c); border-radius:calc(var(--s)*.14);
  box-shadow: inset 0 0 0 1px var(--cd), inset calc(var(--s)*.09) calc(var(--s)*.09) 0 rgba(255,255,255,.34), inset calc(var(--s)*-.07) calc(var(--s)*-.09) 0 rgba(0,0,0,.15)}
.c-a{--c:var(--blue); --cd:var(--blue-d)}
.c-b{--c:var(--orange); --cd:var(--orange-d)}
.rod{position:absolute; display:flex; flex-direction:column-reverse; border-radius:calc(var(--s)*.16); box-shadow:0 0 0 2px var(--rim), 0 4px 0 1px rgba(0,0,0,.12)}
.rod .cube{border-radius:calc(var(--s)*.07)}
.rod.static,.ucol.static{position:relative}
.ucol{position:absolute; display:flex; flex-direction:column-reverse}
.ucol .cube{position:relative}
.cube.zap{animation:zap .55s ease-out forwards}
@keyframes zap{0%{filter:none} 35%{filter:brightness(1.9) saturate(1.25) drop-shadow(0 0 7px #FFD447)} 100%{filter:brightness(1.3) drop-shadow(0 0 4px #FFD447)}}
[data-drag]{touch-action:none; cursor:grab}
[data-say]{cursor:pointer}
.lifted{opacity:.22}
.ghost{position:fixed!important; left:0!important; top:0!important; bottom:auto!important; margin:0!important; z-index:1000; pointer-events:none; filter:drop-shadow(0 16px 14px rgba(0,0,0,.38)); animation:none!important}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.7) saturate(1.3)} 100%{filter:none}}
.ucol.full{border-radius:calc(var(--s)*.16); animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--sun), 0 0 20px 6px rgba(255,212,71,.75)}}

/* ---------- mats (papel quadriculado + QVL) ---------- */
.mat{display:inline-grid; grid-template-rows:auto auto; background:var(--paper); color:var(--ink); border-radius:14px; box-shadow:0 6px 0 rgba(0,0,0,.2); transition:box-shadow .15s}
.mat > :nth-child(1){border-top-left-radius:inherit} .mat > :nth-child(2){border-top-right-radius:inherit} .mat > :nth-child(3){border-bottom-left-radius:inherit} .mat > :nth-child(4){border-bottom-right-radius:inherit}
.mat.want{animation:wantPulse 1s ease-in-out infinite}
@keyframes wantPulse{50%{box-shadow:0 0 0 7px rgba(255,212,71,.35), 0 6px 0 rgba(0,0,0,.2)}}
.mat.want{box-shadow:0 0 0 4px rgba(255,212,71,.55), 0 6px 0 rgba(0,0,0,.2)}
.mat.hot{box-shadow:0 0 0 6px var(--sun), 0 6px 0 rgba(0,0,0,.2)}
.mat.emptied{opacity:.4}
.mh{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5px 2px 4px; border-bottom:2px solid var(--grid-strong); line-height:1}
.mh:first-child{border-right:2px solid var(--grid-strong)}
.mh b{font:800 max(16px,calc(var(--s)*.6))/1 var(--f-display); padding-top:2px}
.mh small{font:700 max(10px,calc(var(--s)*.3))/1.1 var(--f-body); color:var(--ink-soft)}
.col-d,.col-u{position:relative;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:calc(var(--s)/2) calc(var(--s)/2)}
.col-d{border-right:2px solid var(--grid-strong)}
.col-d.want{background-color:rgba(255,212,71,.14)}
.col-d.hot{background-color:rgba(255,212,71,.38)}
.slots{position:absolute; width:var(--s); height:calc(var(--s)*10); border-radius:calc(var(--s)*.12);
  outline:2px dashed var(--grid-strong); outline-offset:2px;
  background:repeating-linear-gradient(to top, transparent 0 calc(var(--s) - 1px), var(--grid-strong) calc(var(--s) - 1px) var(--s))}
.rodslot{position:absolute; width:var(--s); height:calc(var(--s)*10); border-radius:calc(var(--s)*.16); outline:3px dashed var(--sun-d); outline-offset:2px; background:rgba(255,212,71,.22); animation:breathe 1.1s ease-in-out infinite}
@keyframes breathe{50%{background:rgba(255,212,71,.5)}}
.hint{animation:hint .5s ease-in-out 3}
@keyframes hint{50%{background-color:rgba(255,212,71,.55)}}

/* ---------- chips & speech bubble ---------- */
.chip{display:inline-flex; align-items:center; justify-content:center; font:800 1.5rem/1 var(--f-display); padding:8px 14px 5px; border-radius:12px; color:#fff; min-width:2.2em; box-sizing:border-box; white-space:nowrap}
.chip-a{background:var(--blue); box-shadow:0 4px 0 var(--blue-d)}
.chip-b{background:var(--orange); box-shadow:0 4px 0 var(--orange-d)}
.chip-j{background:var(--chalk); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tag{font:700 1rem/1.2 var(--f-body); color:var(--chalk); white-space:nowrap}
.bubble{margin:0; background:var(--paper); color:var(--ink); border-radius:16px; padding:12px 14px; font:700 1.02rem/1.35 var(--f-body); box-sizing:border-box; border:3px solid transparent; min-height:3.5em; display:flex; align-items:center; contain:inline-size}
.bubble.ok{border-color:var(--ok)}
.bubble.no{border-color:var(--no)}
.bubble.info{border-color:var(--sun)}

/* ---------- buttons ---------- */
.btn{border:0; border-radius:16px; min-height:58px; padding:6px 26px 2px; font:800 1.45rem/1 var(--f-display); cursor:pointer; background:var(--sun); color:var(--ink); box-shadow:0 5px 0 var(--sun-d); transition:transform .08s, box-shadow .08s; touch-action:manipulation}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-d)}
.btn.go{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.btn.alt{background:var(--chalk-faint); color:var(--chalk); box-shadow:0 5px 0 rgba(0,0,0,.25)}
.invis{visibility:hidden}

/* ---------- step 1/2: build ---------- */
.target{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; min-width:170px}
.t-txt{display:contents}
.eyebrow{order:-1; font:700 .85rem/1 var(--f-body); letter-spacing:.14em; text-transform:uppercase; color:var(--chalk-soft)}
.bignum{font:800 calc(var(--s)*2.5)/1 var(--f-display); padding:calc(var(--s)*.22) calc(var(--s)*.5) calc(var(--s)*.06); border-radius:calc(var(--s)*.45); color:#fff; margin:6px 0 4px}
.word{font:700 max(1.05rem,calc(var(--s)*.46))/1.2 var(--f-body)}
.decomp{font:700 max(1rem,calc(var(--s)*.4))/1.2 var(--f-body); color:var(--sun)}
.build[data-l="stack"] .target{flex-direction:row; gap:14px; text-align:left}
.build[data-l="stack"] .t-txt{display:flex; flex-direction:column; gap:3px}
.build[data-l="stack"] .bignum{margin:0}
.tray{--s:var(--st); display:flex; align-items:flex-end; gap:calc(var(--s)*1.1); background:rgba(0,0,0,.16); border:2px dashed rgba(255,255,255,.24); border-radius:18px; padding:calc(var(--s)*.6) calc(var(--s)*.9) calc(var(--s)*.45)}
.tray.off{opacity:.35; pointer-events:none}
.src{display:flex; flex-direction:column; align-items:center; gap:8px; animation:idle 2.8s ease-in-out infinite}
.src + .src{animation-delay:-1.4s}
.tray.off .src{animation:none}
@keyframes idle{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}}
.src-l{font:700 .85rem/1.1 var(--f-body); color:var(--chalk-soft); text-align:center}
.src-l b{display:block; font:800 1.35rem/1 var(--f-display); color:var(--chalk)}
.build[data-l="stack"] .tray{align-items:center; padding:10px 14px; gap:18px}
.build[data-l="stack"] .tray .rod{flex-direction:row}
.build[data-l="stack"] .src{flex-direction:row; gap:8px}
.build[data-l="stack"] .src-l{text-align:left}

/* ---------- step 3: join + count ---------- */
.plus{font:800 calc(var(--s)*1.5)/1 var(--f-display); color:var(--chalk); align-self:center; padding-top:30px}
.panel{width:300px; flex:none; background:var(--paper); color:var(--ink); border-radius:18px; padding:14px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; box-shadow:0 6px 0 rgba(0,0,0,.2)}
.count[data-l^="stack"] .panel,.count[data-l="rowW"] .panel{width:min(440px, calc(100vw - 32px))}
.panel .bubble{border-color:var(--grid); background:#fff}
.panel .bubble.ok{border-color:var(--ok)} .panel .bubble.no{border-color:var(--no)} .panel .bubble.info{border-color:var(--sun)}
.q-l{display:flex; align-items:center; gap:8px; font:700 1.02rem/1 var(--f-body)}
.q-l b{width:30px; height:30px; border-radius:8px; background:var(--ink); color:var(--paper); display:grid; place-items:center; font:800 1.1rem/1 var(--f-display); padding-top:2px; box-sizing:border-box}
.q-b{display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-top:8px}
.count[data-l^="stack"] .q-b,.count[data-l="rowW"] .q-b{grid-template-columns:repeat(var(--n), 1fr); gap:4px}
.nb{height:42px; border-radius:11px; border:2px solid var(--grid-strong); background:#fff; font:800 1.35rem/1 var(--f-display); color:var(--ink); cursor:pointer; padding:3px 0 0; touch-action:manipulation; min-width:0}
.nb:active{transform:scale(.94)}
.nb.ok{background:var(--ok); border-color:var(--ok-d); color:#fff}
.nb.no{background:var(--no); border-color:var(--no-d); color:#fff; animation:shake .38s}
.nb:disabled{cursor:default}
.nb:disabled:not(.ok):not(.no){opacity:.4}
.panel .btn{align-self:stretch}
@keyframes shake{20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}

/* ---------- step 4: sum ---------- */
.eqcard{width:min(420px, calc(100vw - 32px)); flex:none; background:var(--paper); color:var(--ink); border-radius:20px; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:18px; box-shadow:0 6px 0 rgba(0,0,0,.2)}
.eq{display:flex; align-items:center; gap:10px; font:800 2.6rem/1 var(--f-display)}
.eq .chip{font-size:2.3rem; padding:10px 14px 6px}
.op{color:var(--ink); padding-top:6px}
.ans{min-width:2.1em; height:1.5em; box-sizing:border-box; border:4px dashed var(--ink-soft); border-radius:14px; display:grid; place-items:center; padding-top:6px; transition:background .15s, border-color .15s}
.ans.want{border-color:var(--sun-d); background:rgba(255,212,71,.18)}
.ans.hot{border-color:var(--sun-d); background:rgba(255,212,71,.5)}
.ans.ok{border-style:solid; border-color:var(--ok-d); background:var(--ok); color:#fff}
.opts{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.opt{width:78px; height:78px; border-radius:18px; background:var(--sun); box-shadow:0 5px 0 var(--sun-d); display:grid; place-items:center; font:800 2.2rem/1 var(--f-display); color:var(--ink); padding-top:6px; box-sizing:border-box}
.opt.bad{opacity:.28; filter:grayscale(1); text-decoration:line-through; cursor:default}
.opt.gone{visibility:hidden}
.eqcard .bubble{width:100%; background:#fff; border-color:var(--grid)}
.eqcard .bubble.ok{border-color:var(--ok)} .eqcard .bubble.no{border-color:var(--no)}
.after{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.after .btn.alt{background:#EEF3F6; color:var(--ink); box-shadow:0 5px 0 var(--grid-strong)}

/* ---------- phones (iPhone em pé ou deitado) ---------- */
@media (max-width:560px), (max-height:560px){
  #top{min-height:52px; padding-top:6px; padding-bottom:6px; gap:8px}
  .steps{gap:4px}
  .steps li{padding:3px}
  .steps li b{width:26px; height:26px; font-size:.95rem}
  .ib{height:40px; min-width:40px; padding:0 8px}
  .ib.say{padding:0 9px}
  .stars{font-size:1.1rem; padding:0 2px}
  .stars svg{width:20px; height:20px}
  #stage{padding-top:8px; padding-bottom:8px; padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px))}
  .scene{gap:calc(var(--s)*.35) calc(var(--s)*.6)}
  .fig{gap:5px}
  .fig-cap{min-height:30px; gap:5px}
  .chip{font-size:1.2rem; padding:6px 10px 3px; border-radius:10px; box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .chip-a{box-shadow:0 3px 0 var(--blue-d)} .chip-b{box-shadow:0 3px 0 var(--orange-d)}
  .tag{font-size:.9rem}
  .bubble{font-size:.93rem; line-height:1.3; padding:7px 11px; border-width:2px; border-radius:12px; min-height:2.6em}
  .btn{min-height:46px; font-size:1.2rem; padding:5px 20px 1px; border-radius:13px; box-shadow:0 4px 0 var(--sun-d)}
  .mat{border-radius:10px; box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .mh{padding:3px 2px 2px}
  .mh small{display:none}
  .eyebrow{font-size:.72rem}
  .word{font-size:1rem} .decomp{font-size:.95rem}
  .target{min-width:0}
  .tray{border-radius:14px}
  .src{gap:5px}
  .src-l{font-size:.72rem}
  .src-l b{font-size:1.05rem}
  .plus{font-size:2rem; padding-top:24px}
  .panel{padding:10px; gap:8px; border-radius:14px}
  .q-l{font-size:.93rem}
  .q-l b{width:24px; height:24px; font-size:.95rem; border-radius:6px}
  .q-b{margin-top:5px}
  .nb{height:38px; font-size:1.15rem; border-radius:9px}
  .eqcard{padding:12px; gap:10px; border-radius:16px}
  .eq{font-size:1.9rem; gap:7px}
  .eq .chip{font-size:1.7rem; padding:7px 10px 4px}
  .ans{border-width:3px; border-radius:11px}
  .opts{gap:10px}
  .opt{width:62px; height:62px; font-size:1.8rem; border-radius:14px; box-shadow:0 4px 0 var(--sun-d)}
  .after .btn{min-height:44px}
}
@media (max-height:560px){ #top{min-height:46px; padding-top:3px; padding-bottom:3px} .ib{height:38px; min-width:38px} }

/* ---------- home ---------- */
.home{margin:auto; width:100%; max-width:1060px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:44px; align-items:center; padding-block:12px}

<body>

<div id="app">
  <header id="top"></header>
  <main id="stage" aria-label="Jogo de somar"></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<div id="fx" aria-hidden="true"></div>

<script src="game-voice.js"></script>
<script>
(() => {
'use strict';
const root = document.documentElement;
const stage = document.getElementById('stage');
const topBar = document.getElementById('top');
const fx = document.getElementById('fx');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const phoneMQ = matchMedia('(max-width:560px), (max-height:560px)');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- números por extenso ---------- */
const UN = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const DZ = ['','dez','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
function ext(n, fem){
  if (n === 100) return 'cem';
  if (n > 100) return 'cento e ' + ext(n - 100, fem);
  if (n < 20){ if (fem && n === 1) return 'uma'; if (fem && n === 2) return 'duas'; return UN[n]; }
  const t = Math.floor(n / 10), u = n % 10;
  return u ? DZ[t] + ' e ' + ext(u, fem) : DZ[t];
}
const dzT = n => n === 1 ? '1 dezena' : n + ' dezenas';
const unT = n => n === 1 ? '1 unidade' : n + ' unidades';
const dzF = n => n === 1 ? 'uma dezena' : ext(n, true) + ' dezenas';
const unF = n => n === 1 ? 'uma unidade' : ext(n, true) + ' unidades';
function decT(n){ const t = Math.floor(n/10), u = n%10; if (!t) return unT(u); if (!u) return dzT(t); return dzT(t) + ' e ' + unT(u); }
function decF(n){ const t = Math.floor(n/10), u = n%10; if (!t) return unF(u); if (!u) return dzF(t); return dzF(t) + ' e ' + unF(u); }

/* ---------- níveis ---------- */
const LEVELS = {
  l1: { name:'Até 20',   sub:'para começar',      ex:[8,7] },
  l2: { name:'Até 50',   sub:'sem troca',         ex:[23,14] },
  l3: { name:'Até 100',  sub:'com troca',         ex:[27,15] },
  l4: { name:'Surpresa', sub:'um pouco de tudo',  ex:null }
};
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function gen(lv){
  if (lv === 'l4') lv = ['l1','l2','l3','l3'][rnd(0,3)];
  let a = 8, b = 7;
  for (let i = 0; i < 300; i++){
    if (lv === 'l1'){ a = rnd(2,12); b = rnd(2,9); if (a + b <= 20 && a + b >= 7) break; }
    else if (lv === 'l2'){ const ta = rnd(1,3), tb = rnd(0,2), ua = rnd(0,8), ub = rnd(1, 9 - ua); a = ta*10 + ua; b = tb*10 + ub; if (ta + tb <= 4 && b >= 3) break; }
    else { const ua = rnd(2,9), ub = rnd(10 - ua, 9), ta = rnd(1,6), tb = rnd(0,3); a = ta*10 + ua; b = tb*10 + ub; if (a + b <= 100) break; }
  }
  return [a, b];
}
function makeOptions(a, b){
  const c = a + b, carry = (a % 10 + b % 10) >= 10;
  const near = Math.random() < .5 ? [c + 1, c - 1] : [c - 1, c + 1];
  const far = Math.random() < .5 ? [c + 10, c - 10] : [c - 10, c + 10];
  const swap = (c % 10) * 10 + Math.floor(c / 10);
  const pri = carry ? [c - 10, near[0], c + 10, swap, near[1], c + 2] : [near[0], far[0], swap, near[1], far[1], c + 2, c - 2];
  const out = [c];
  for (const v of pri){ if (out.length >= 4) break; if (v >= 0 && v <= 110 && !out.includes(v)) out.push(v); }
  for (let k = 3; out.length < 4; k++) if (!out.includes(c + k)) out.push(c + k);
  for (let i = out.length - 1; i > 0; i--){ const j = rnd(0, i); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

/* ---------- estado ---------- */
const S = {
  screen:'home', level:null, a:0, b:0, step:0, score:0, sound:true, pid:0, layout:'', bubbleH:0,
  Z:null, msg:null, tries:0, built:false, jk:null, busy:false, grouping:false,
  ready3:false, countShown:false, countTimer:0, fullPrompted:false, ans:{t:null,u:null}, wrongBtn:null,
  opts:[], optBad:[], solved:false, lastSay:'', flash:null, lastKey:''
};
let uid = 0;
const mk = (kind, colors) => ({ id:'p' + (++uid), kind, colors });
const emptyZ = () => ({ tens:[], ones:[] });
const tgt  = () => S.step === 1 ? S.a : S.b;
const tcol = () => S.step === 1 ? 'a' : 'b';
const capT = () => Math.min(9, Math.max(3, Math.floor(tgt() / 10) + (phoneMQ.matches ? 1 : 2)));
const carry = () => (S.a % 10 + S.b % 10) >= 10;
const nTJ = () => Math.max(1, Math.floor(S.a/10) + Math.floor(S.b/10) + (carry() ? 1 : 0));
const cnt = k => S.Z[k].tens.length + S.Z[k].ones.length;
const other = k => k === 'A' ? 'B' : 'A';
/* na etapa 3 tudo acaba num quadro só: devolve qual, ou null se os dois ainda têm peças */
const joinKey = () => !cnt('A') ? 'B' : !cnt('B') ? 'A' : null;
const fullKey = () => ['A','B'].find(k => S.Z[k].ones.length >= 10) || null;

/* ---------- som: blocos de madeira, notas que sobem com a pilha ---------- */
let AC = null, OUT = null, NB = null;
function unlockAudio(){
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;
      OUT = AC.createGain(); OUT.gain.value = .9; OUT.connect(comp); comp.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * .6); NB = AC.createBuffer(1, len, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch(e){}
}
function env(g, t, a, peak, dec){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }
function osc(type, f, t, dur, peak, f2){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * .6);
  env(g, t, .004, peak, dur); o.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + .06);
}
function noise(t, dur, peak, type, f, q, f2){
  const s = AC.createBufferSource(); s.buffer = NB;
  const bf = AC.createBiquadFilter(); bf.type = type; bf.frequency.setValueAtTime(f, t); if (f2) bf.frequency.exponentialRampToValueAtTime(f2, t + dur); bf.Q.value = q || 1;
  const g = AC.createGain(); env(g, t, .006, peak, dur);
  s.connect(bf); bf.connect(g); g.connect(OUT); s.start(t, Math.random() * .3); s.stop(t + dur + .06);
}
const PENTA = [523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760];
function clack(i, vol){
  if (!S.sound || !AC) return;
  const f = PENTA[clamp(i | 0, 0, 9)], t = AC.currentTime + .003, v = vol == null ? 1 : vol;
  try { osc('sine', f * 1.5, t, .13, .2 * v, f); osc('triangle', f * 3.01, t, .04, .05 * v); noise(t, .022, .12 * v, 'bandpass', 3200, 2.5); } catch(e){}
}
function sfx(k, v){
  if (!S.sound || !AC) return;
  v = v == null ? 1 : v;
  const t = AC.currentTime + .004;
  try {
    switch (k){
      case 'thud': osc('sine', 200, t, .22, .34 * v, 68); noise(t, .09, .2 * v, 'lowpass', 900, .7); osc('triangle', 400, t, .05, .06 * v); break;
      case 'whoosh': noise(t, .34, .06 * v, 'bandpass', 450, 1.3, 2600); break;
      case 'lift': osc('sine', 420, t, .07, .09, 660); break;
      case 'press': osc('sine', 310, t, .05, .07, 380); break;
      case 'pop': osc('sine', 620, t, .09, .17, 980); break;
      case 'no': osc('triangle', 262, t, .14, .17, 210); osc('triangle', 196, t + .12, .22, .15, 150); break;
      case 'tick': osc('sine', 1046, t, .06, .11); break;
      case 'zap': { const f = PENTA[clamp(v | 0, 0, 9)] * 2; osc('triangle', f, t, .08, .07); osc('sine', f, t, .14, .09); break; }
      case 'group': [523.25,659.25,783.99,1046.5].forEach((f, i) => { osc('triangle', f, t + i * .06, .5, .12); osc('sine', f * 2, t + i * .06, .3, .04); }); break;
      case 'win': [523.25,659.25,783.99,1046.5,1318.51,1567.98].forEach((f, i) => { osc('triangle', f, t + i * .075, .45, .13); osc('sine', f / 2, t + i * .075, .3, .05); }); noise(t + .35, .5, .03, 'highpass', 6000, .5); break;
      case 'note': { const f = PENTA[clamp(v | 0, 0, 9)]; osc('triangle', f, t, .3, .12); osc('sine', f * 2, t, .18, .04); break; }
    }
  } catch(e){}
}
const hasTTS = 'speechSynthesis' in window;
function say(text){
  if (!text) return;
  S.lastSay = text;
  if (S.sound) window.BlockVoice?.speak(text);
}
function populateVoiceSettings(){
  const select = document.getElementById('voice-choice');
  if (!select || !window.BlockVoice) return;
  const settings = BlockVoice.getSettings();
  select.replaceChildren(new Option('Automática · melhor voz disponível',''));
  for (const v of BlockVoice.voices()) select.add(new Option(v.name, v.voiceURI));
  select.value = settings.voiceURI || '';
  document.getElementById('voice-speed').value = String(settings.rate);
}
addEventListener('blockvoiceschanged', populateVoiceSettings);
stage.addEventListener('change', e => {
  if (e.target.id === 'voice-choice') BlockVoice.configure({voiceURI:e.target.value});
  if (e.target.id === 'voice-speed') BlockVoice.configure({rate:Number(e.target.value)});
});

/* ---------- ícones ---------- */
const IC = {
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 3.5l9 7.7V20a1 1 0 0 1-1 1h-5.2v-6.3H9.2V21H4a1 1 0 0 1-1-1z"/></svg>',
  speak:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.2h3.8L12 5v14l-5.2-4.2H3z"/><path d="M15.3 8.6a4.8 4.8 0 0 1 0 6.8M17.9 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  note:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.6" cy="17.6" r="2.6"/><circle cx="16.6" cy="15.4" r="2.6"/></svg>',
  noteOff:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" opacity=".5"/><circle cx="6.6" cy="17.6" r="2.6" opacity=".5"/><circle cx="16.6" cy="15.4" r="2.6" opacity=".5"/><path d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  star:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>'
};

/* ---------- desenho das peças ---------- */
const cubes = cols => cols.map(c => `<i class="cube c-${c}"></i>`).join('');
const px = n => `calc(var(--s)*${+n.toFixed(3)})`;
/* no celular as barras ficam mais juntinhas, sobrando espaço para cubos maiores */
const geo = () => phoneMQ.matches ? { pad:.3, gap:.3 } : { pad:.5, gap:.5 };

function matHTML(k, o){
  const z = S.Z[k], nT = o.nT, nU = o.nU, G = geo(), P = 1 + G.gap;
  const dW = nT * P - G.gap + 2 * G.pad, uW = nU * P - G.gap + 2 * G.pad, H = 10 + 2 * G.pad;
  const x = i => px(G.pad + i * P), y = px(G.pad);
  const rods = z.tens.map((p, i) =>

  }

}

/* ---------- ajuste de tamanho: maior cubo possível sem rolar a tela ---------- */
let SPX = 34;
function setS(s){ SPX = s; root.style.setProperty('--s', s + 'px'); root.style.setProperty('--st', Math.round(s * (phoneMQ.matches ? .85 : .78)) + 'px'); }
function fits(){ return stage.scrollHeight <= stage.clientHeight && stage.scrollWidth <= stage.clientWidth; }
function fit(){
  const sc = stage.querySelector('.scene');
  stage.classList.remove('clip');
  if (!sc){ setS(34); return; }
  const bub = sc.querySelector('.bubble'), saved = bub ? bub.innerHTML : '';
  if (bub){ bub.style.minHeight = ''; bub.textContent = SAMPLE[sc.dataset.sample] || saved; }
  const layouts = (sc.dataset.layouts || 'wide').split(' ');
  const MIN = 24, MAX = 52;
  let best = null;
  for (const l of layouts){
    sc.dataset.l = l;
    let s;
    setS(MAX);
    if (fits()) s = MAX;
    else {
      let lo = MIN, hi = MAX - 1;
      while (lo < hi){ const mid = Math.ceil((lo + hi) / 2); setS(mid); if (fits()) lo = mid; else hi = mid - 1; }
      setS(lo); s = fits() ? lo : MIN - 1;
    }
    if (!best || s > best.s) best = { s, l };
  }
  // Preserve readable blocks if the viewport is too short; vertical scrolling is safer than tiny pieces.
  if (best.s < MIN){
    let fallback = null;
    for (const l of layouts){
      sc.dataset.l = l; setS(MIN);
      const r = sc.getBoundingClientRect();
      if (r.width <= stage.clientWidth - 24 && (!fallback || r.height < fallback.h)) fallback = {l,h:r.height};
    }
    if (fallback) best.l = fallback.l;
  }
  sc.dataset.l = best.l; S.layout = best.l; setS(Math.max(MIN, best.s));
  if (bub){ S.bubbleH = Math.ceil(bub.getBoundingClientRect().height); bub.innerHTML = saved; bub.style.minHeight = S.bubbleH + 'px'; }
  /* coube: corta o que voa para fora (peças em pleno ar não criam barra de rolagem) */
  if (best.s >= MIN) stage.classList.add('clip');
}
let rq = 0;
addEventListener('resize', () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(() => { cancelDrag(); anims.clear(); fitKey = ''; render(); }); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { anims.clear(); fitKey = ''; render(); });

/* =====================================================================
   MOTOR DE FÍSICA DOS BLOQUINHOS
   Cada peça animada guarda um deslocamento (x, y) em relação ao lugar
   dela no quadro, velocidade, giro e "amassado" (squash). Gravidade,
   arco de lançamento, quique e impacto que passa para os cubos de baixo.
   ===================================================================== */
const anims = new Map();
let rafId = 0, lastT = 0;
const G = () => SPX * 80;   /* gravidade de desenho animado, proporcional ao tamanho do cubo */
function finOf(el){ const r = el.getBoundingClientRect(); return { cx:r.left + r.width / 2, by:r.bottom, w:r.width || 1, h:r.height || 1 }; }
function newState(el){ return { pid:el.dataset.pid, el, fin:finOf(el), x:0, y:0, vx:0, vy:0, k:1, r:0, vr:0, q:0, qv:0, type:'rest', o:{}, t:0, delay:0, impacts:0, bounced:false }; }
function apply(a){
  const sx = a.k * (1 + a.q * .55), sy = a.k * (1 - a.q);
  a.el.style.transform = `translate(${a.x.toFixed(2)}px,${a.y.toFixed(2)}px) rotate(${a.r.toFixed(2)}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
}
function startAnim(el, from, type, o){
  if (reduced || !el || !el.dataset.pid) return null;
  o = o || {};
  let a = anims.get(el.dataset.pid);
  if (!a || a.el !== el) a = newState(el);
  if (from){
    a.x = (from.left + from.width / 2) - a.fin.cx; a.y = from.bottom - a.fin.by;
    const k = from.width / a.fin.w; a.k = isFinite(k) && k > 0 ? clamp(k, .2, 3) : 1;
    a.vx = 0; a.vy = 0; a.r = 0; a.vr = 0;
  }
  a.o = o; a.type = type; a.t = 0; a.delay = o.delay || 0; a.impacts = 0; a.bounced = false;
  if (type === 'toss') planToss(a, o.apex == null ? 2.2 : o.apex);
  else if (type === 'hop'){ a.vy = -Math.sqrt(2 * G() * SPX * (o.h || .55)); a.type = 'fall'; }
  else if (type === 'fall'){ a.vy = o.vy || 0; el.style.zIndex = 40; }
  el.style.transformOrigin = '50% 100%';
  el.style.willChange = 'transform';
  if (a.delay > 0 && o.hideUntil) el.style.opacity = '0';
  anims.set(a.pid, a); apply(a); kickLoop();
  return a;
}
function planToss(a, ap){
  let g = G(); const s = SPX;
  if (a.y < -4 * s) ap = Math.min(ap, 1.2);      /* já vem do alto: sobe pouco antes de cair */
  const apex = Math.min(a.y, 0) - ap * s;
  const flight = gg => { const v = -Math.sqrt(Math.max(0, 2 * gg * (a.y - apex))); return { v, T: -v / gg + Math.sqrt(Math.max(0, 2 * (0 - apex) / gg)) }; };
  let f = flight(g);
  const TMAX = a.o.heavy ? .78 : .6;
  if (f.T > TMAX){ g *= (f.T / TMAX) * (f.T / TMAX); f = flight(g); }
  a.g = g; a.vy0 = f.v;
  a.T = Math.max(.08, f.T); a.x0 = a.x; a.y0 = a.y; a.k0 = a.k; a.t = 0;
  a.spin = clamp(-a.x0 / s * 2.4, -18, 18) * (a.el.classList.contains('rod') ? .45 : 1);
  a.el.style.zIndex = 60;
  if (Math.abs(a.x0) > 5 * s && a.o.whoosh !== false) sfx('whoosh', a.o.heavy ? 1.4 : .8);
}
function step(a, dt){
  if (a.delay > 0){
    a.delay -= dt; if (a.delay > 0) return true;
    a.el.style.opacity = '';
    if (a.o.onStart) a.o.onStart(a);
  }
  const g = G();
  switch (a.type){
    case 'toss': {
      a.t += dt; const t = Math.min(a.t, a.T), u = t / a.T;
      a.x = a.x0 * (1 - u);
      a.y = a.y0 + a.vy0 * t + .5 * a.g * t * t;
      a.k = a.k0 + (1 - a.k0) * Math.min(1, u / .55);
      a.r = a.spin * Math.sin(Math.PI * u);
      if (a.t >= a.T){ a.x = 0; a.y = 0; a.k = 1; a.r = 0; a.vr = -a.spin * 2; land(a, Math.min(a.vy0 + a.g * a.T, 30 * SPX)); }
      break;
    }
    case 'fall': {
      a.vy += g * dt; a.y += a.vy * dt;
      a.x -= a.x * Math.min(1, dt * 12);
      a.k += (1 - a.k) * Math.min(1, dt * 12);
      if (a.y >= 0 && a.vy > 0){ a.y = 0; land(a, a.vy); }
      break;
    }
    case 'spring': {
      const K = 280, C = 19;
      a.vx += (-K * a.x - C * a.vx) * dt; a.vy += (-K * a.y - C * a.vy) * dt;
      a.x += a.vx * dt; a.y += a.vy * dt; a.k += (1 - a.k) * Math.min(1, dt * 12);
      if (Math.abs(a.x) < .4 && Math.abs(a.y) < .4 && Math.abs(a.vx) < 6 && Math.abs(a.vy) < 6){ a.x = a.y = a.vx = a.vy = 0; a.k = 1; a.type = 'rest'; a.el.style.zIndex = ''; }
      break;
    }
  }
  /* amassado (squash & stretch) e giro: molas amortecidas */
  a.qv += (-900 * a.q - 22 * a.qv) * dt; a.q += a.qv * dt; a.q = clamp(a.q, -.35, .35);
  if (a.type !== 'toss'){ a.vr += (-320 * a.r - 15 * a.vr) * dt; a.r += a.vr * dt; }
  return !(a.type === 'rest' && Math.abs(a.q) < .003 && Math.abs(a.qv) < .05 && Math.abs(a.r) < .08 && Math.abs(a.vr) < .8);
}
function land(a, v){
  const s = SPX, u = Math.max(0, v / s);       /* velocidade do impacto, em cubos por segundo */
  a.impacts++;
  a.qv += Math.min(9, u * .32) * (a.o.heavy ? 1.35 : 1);
  const vb = v * (a.o.heavy ? .15 : .21);
  if (!a.bounced && vb > 2.4 * s){ a.vy = -vb; a.type = 'fall'; a.bounced = true; }
  else { a.vy = 0; a.type = 'rest'; a.el.style.zIndex = ''; }
  if (a.impacts === 1) onImpact(a, u);
  else if (u > 5 && !a.o.silent){ if (a.el.classList.contains('rod')) sfx('thud', .25); else clack(stackIndex(a.el), .3); }
}
function stackIndex(el){ const p = el.parentElement; return p ? Array.prototype.indexOf.call(p.children, el) : 0; }
function onImpact(a, u){
  const el = a.el, isRod = el.classList.contains('rod'), vol = a.o.vol == null ? 1 : a.o.vol;
  if (!a.o.silent){ if (isRod) sfx('thud', (a.o.heavy ? 1.2 : .7) * vol); else clack(stackIndex(el), vol); }
  const r = el.getBoundingClientRect();
  if (u > 9 && !a.o.nodust) puff(r.left, r.bottom, r.width, Math.min(1.3, u / 20) * (a.o.heavy ? 1.8 : 1) * (a.o.dust || 1));
  if (!isRod){
    /* o impacto desce pela pilha: cada cubo de baixo amassa um pouco, com atraso */
    let b = el.previousElementSibling, d = 1;
    while (b){
      const pid = b.dataset.pid, amt = u * .2 * Math.pow(.74, d);
      setTimeout(() => kick(stage.querySelector(`[data-pid="${pid}"]`), amt), d * 22);
      b = b.previousElementSibling; d++;
    }
  } else {
    /* barras vizinhas balançam como dominós */
    let n = el.previousElementSibling, d = 1;
    while (n){
      if (n.classList.contains('rod')){
        const pid = n.dataset.pid, amp = (a.o.heavy ? 70 : 28) * Math.pow(.6, d) * (d % 2 ? -1 : 1);
        setTimeout(() => kick(stage.querySelector(`[data-pid="${pid}"]`), u * .08, amp), d * 35);
        d++;
      }
      n = n.previousElementSibling;
    }
    if (a.o.heavy){ shakeEl(el.closest('.mat'), 6); ring(r.left + r.width / 2, r.bottom, 12, COL.sun); }
  }
  if (a.o.onLand) a.o.onLand(a);
}
function kick(el, qv, vr){
  if (reduced || !el || !el.isConnected || !el.dataset.pid) return;
  let a = anims.get(el.dataset.pid);
  if (!a || a.el !== el){ a = newState(el); el.style.transformOrigin = '50% 100%'; anims.set(a.pid, a); }
  a.qv += qv || 0; a.vr += vr || 0; kickLoop();
}
/* depois de cada render as peças são elementos novos: a animação continua de onde estava */
function rebind(){
  for (const [pid, a] of anims){
    const el = stage.querySelector(`[data-pid="${pid}"]`);
    if (!el){ anims.delete(pid); continue; }
    if (el === a.el) continue;
    const nf = finOf(el), dx = a.fin.cx - nf.cx, dy = a.fin.by - nf.by;
    a.x += dx; a.y += dy;
    if (nf.w) a.k *= a.fin.w / nf.w;
    if (a.type === 'toss' && (Math.abs(dx) > .5 || Math.abs(dy) > .5)){ a.vy = a.vy0 + a.g * a.t; a.type = 'fall'; }
    a.fin = nf; a.el = el;
    el.style.transformOrigin = '50% 100%'; el.style.willChange = 'transform';
    if (a.delay > 0 && a.o.hideUntil) el.style.opacity = '0';
    if (a.type === 'toss' || a.type === 'fall') el.style.zIndex = 60;
    apply(a);
  }
}
function kickLoop(){ if (!rafId){ lastT = performance.now(); rafId = requestAnimationFrame(loop); } }
function loop(now){
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  for (const [pid, a] of anims){
    if (!a.el.isConnected){ anims.delete(pid); continue; }
    let alive = true, rem = dt;
    while (rem > 1e-6 && alive){ const h = Math.min(rem, 1 / 120); alive = step(a, h); rem -= h; }
    if (alive) apply(a);
    else { a.el.style.transform = ''; a.el.style.zIndex = ''; a.el.style.willChange = ''; anims.delete(pid); }
  }
  if (D && D.on) dragStep(dt);
  stepParts(dt);
  rafId = (anims.size || parts.length || (D && D.on) || fxDirty) ? requestAnimationFrame(loop) : 0;
}

/* ---------- partículas (canvas): poeira, faíscas, anéis e confete de cubinhos ---------- */
const cv = document.createElement('canvas'); fx.appendChild(cv);
const c2 = cv.getContext('2d');
function sizeFx(){ const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); c2.setTransform(d, 0, 0, d, 0, 0); }
sizeFx(); addEventListener('resize', sizeFx);
const cssv = n => getComputedStyle(root).getPropertyValue(n).trim();
const COL = { blue:cssv('--blue'), blueD:cssv('--blue-d'), orange:cssv('--orange'), orangeD:cssv('--orange-d'), sun:cssv('--sun'), sunD:cssv('--sun-d'), ok:cssv('--ok'), okD:cssv('--ok-d'), chalk:cssv('--chalk') };
let parts = [], fxDirty = false;
function addP(p){ if (reduced) return; p.life = 0; parts.push(p); kickLoop(); }
function puff(x, y, w, k){
  const n = Math.round(2 + 4 * k);
  for (let i = 0; i < n; i++){
    const side = i % 2 ? 1 : -1;
    addP({ t:'dust', x:x + (side > 0 ? w : 0), y:y - 2, vx:side * (40 + Math.random() * 80) * k, vy:-(8 + Math.random() * 30) * k, r:1.2 + Math.random() * 2 * k, gr:9 + Math.random() * 12, max:.35 + Math.random() * .25 });
  }
}
function sparkle(x, y, n, spread, cols){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = spread * (.35 + Math.random() * .8);
    addP({ t:'spark', x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - spread * .35, rot:Math.random() * 6, vr:(Math.random() - .5) * 12, size:5 + Math.random() * 7, col:cols[i % cols.length], max:.7 + Math.random() * .5 });
  }
}
function ring(x, y, r0, col){ addP({ t:'ring', x, y, r:r0, vr:300, col, max:.45 }); }
function cubeBurst(x, y, n, opt){
  opt = opt || {};
  const cols = [[COL.blue, COL.blueD], [COL.orange, COL.orangeD], [COL.sun, COL.sunD], [COL.ok, COL.okD]];
  for (let i = 0; i < n; i++){
    const ang = (opt.angle == null ? -Math.PI / 2 : opt.angle) + (Math.random() - .5) * (opt.spread || 1.6);
    const sp = (opt.speed || 900) * (.45 + Math.random() * .7), c = cols[i % cols.length];
    addP({ t:'cube', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp, rot:Math.random() * 6, vr:(Math.random() - .5) * 14, size:8 + Math.random() * 9, col:c[0], colD:c[1], max:3 + Math.random() * 1.2 });
  }
}
function star(x, y, s, rot, col, al){
  c2.save(); c2.translate(x, y); c2.rotate(rot); c2.globalAlpha = al; c2.fillStyle = col; c2.beginPath();
  for (let i = 0; i < 8; i++){ const r = i % 2 ? s * .32 : s, a = i * Math.PI / 4; c2.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  c2.closePath(); c2.fill(); c2.restore();
}
function drawCube(p, al){
  const s = p.size, h = s / 2, rr = s * .18;
  c2.save(); c2.translate(p.x, p.y); c2.rotate(p.rot); c2.globalAlpha = al;
  c2.fillStyle = p.colD; rrect(-h, -h, s, s, rr); c2.fill();
  c2.fillStyle = p.col; rrect(-h + 1, -h + 1, s - 2, s - 2, rr * .8); c2.fill();
  c2.fillStyle = 'rgba(255,255,255,.38)'; c2.fillRect(-h + 2, -h + 2, s - 5, s * .16); c2.fillRect(-h + 2, -h + 2, s * .16, s - 5);
  c2.restore();
}
function rrect(x, y, w, h, r){ c2.beginPath(); if (c2.roundRect) c2.roundRect(x, y, w, h, r); else c2.rect(x, y, w, h); }
function stepParts(dt){
  if (!parts.length){ if (fxDirty){ c2.clearRect(0, 0, innerWidth, innerHeight); fxDirty = false; } return; }
  c2.clearRect(0, 0, innerWidth, innerHeight); fxDirty = true;
  const floor = innerHeight - 4;
  parts = parts.filter(p => {
    p.life += dt; if (p.life > p.max) return false;
    const f = p.life / p.max;
    if (p.t === 'dust'){
      p.vx *= Math.pow(.03, dt); p.vy = p.vy * Math.pow(.15, dt) - 8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.gr * dt;
      c2.globalAlpha = .3 * (1 - f) * (1 - f); c2.fillStyle = '#fff'; c2.beginPath(); c2.arc(p.x, p.y, p.r, 0, 7); c2.fill();
    } else if (p.t === 'spark'){
      p.vy += 520 * dt; p.vx *= Math.pow(.35, dt); p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      star(p.x, p.y, p.size * (1 - f * .5), p.rot, p.col, 1 - f * f);
    } else if (p.t === 'ring'){
      p.r += p.vr * dt; p.vr *= Math.pow(.04, dt);
      c2.globalAlpha = .75 * (1 - f); c2.strokeStyle = p.col; c2.lineWidth = 4 * (1 - f) + 1; c2.beginPath(); c2.arc(p.x, p.y, p.r, 0, 7); c2.stroke();
    } else if (p.t === 'cube'){
      p.vy += 1800 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const h = p.size / 2;
      if (p.y > floor - h){ p.y = floor - h; if (p.vy > 140){ p.vy *= -.42; p.vx *= .72; p.vr *= .55; } else { p.vy = 0; p.vx *= Math.pow(.02, dt); p.vr *= Math.pow(.005, dt); } }
      if (p.x < h){ p.x = h; p.vx = Math.abs(p.vx) * .6; } else if (p.x > innerWidth - h){ p.x = innerWidth - h; p.vx = -Math.abs(p.vx) * .6; }
      drawCube(p, f > .8 ? (1 - f) / .2 : 1);
    }
    c2.globalAlpha = 1;
    return true;
  });
}

/* ---------- efeitos ---------- */
function popEl(el, k){
  if (reduced || !el || !el.animate) return;
  const s = 1 + (k || .2);
  el.animate([{ transform:'scale(1)' }, { transform:`scale(${s})`, offset:.35 }, { transform:`scale(${2 - s * .98})`, offset:.65 }, { transform:'scale(1)' }], { duration:460, easing:'ease-out' });
}
function shakeEl(el, amp){
  if (reduced || !el || !el.animate) return;
  const a = amp || 6, kf = [];
  for (let i = 0; i < 7; i++) kf.push({ transform:`translate(${(i % 2 ? 1 : -1) * a * (1 - i / 7)}px, ${((i % 3) - 1) * a * .35 * (1 - i / 7)}px)` });
  kf.push({ transform:'none' });

}
function centerOf(el){ const r = el.getBoundingClientRect(); return { x:r.left + r.width / 2, y:r.top + r.height / 2, r }; }
function floatLabel(x, y, text, cls){

  d.style.left = x + 'px'; d.style.top = y + 'px'; fx.appendChild(d);

    { transform:'translate(-50%,-20%) scale(.3)', opacity:0 },

/* todas as peças de um quadro dão um pulinho em onda (comemoração) */

  [...scope.querySelectorAll('[data-pid]')].forEach((el, i) => startAnim(el, null, 'hop', { delay:(o.delay || 0) + i * (o.step || .035), h:o.h || .55, vol:o.vol == null ? .5 : o.vol, nodust:true }));
}
/* peças caem do alto em cascata (entrada da etapa) */
function rainIn(scope, o){
  if (reduced || !scope) return;
  o = o || {};
  [...scope.querySelectorAll('[data-pid]')].forEach((el, i) => {
    const r = el.getBoundingClientRect(), up = SPX * ((el.classList.contains('rod') ? 4 : 3) + Math.random());
    startAnim(el, { left:r.left, width:r.width, bottom:r.bottom - up }, 'fall', { delay:(o.delay || 0) + i * (o.step || .04), hideUntil:true, vol:.55, dust:.6 });

}
/* conta as barras ou os cubinhos um por um, com número flutuando e nota subindo */
function countUp(kind){

  const pids = [...mat.querySelectorAll(kind === 't' ? '.col-d .rod' : '.col-u .cube')].map(e => e.dataset.pid);

/* 10 cubinhos se acendem de baixo para cima, se espremem e viram uma barra */
function fuse(el, done){
  const problemId = S.pid, stepId = S.step;
  if (reduced || !el){ done(el ? el.getBoundingClientRect() : null); return; }
  S.busy = true;
  const cs = [...el.querySelectorAll('.cube')], STEP = 46;
  cs.forEach((c, i) => setTimeout(() => {
    if (S.pid !== problemId || S.step !== stepId) return;
    const live = c.dataset.pid ? (stage.querySelector(`[data-pid="${c.dataset.pid}"]`) || c) : c;
    live.classList.add('zap'); kick(live, 4.5);
    sfx('zap', i);
  }, i * STEP));
  const t1 = cs.length * STEP + 70;
  setTimeout(() => {
    if (S.pid !== problemId || S.step !== stepId) return;
    const base = el.style.transform || '';
    if (!base) el.style.transformOrigin = '50% 100%';
    el.animate([{ transform:base || 'none' }, { transform:`${base} scale(1.14,.84)`, offset:.55 }, { transform:`${base} scale(.9,1.1)` }], { duration:200, easing:'ease-in-out', fill:'forwards' });
  }, t1);
  setTimeout(() => { if (S.pid !== problemId || S.step !== stepId) return; const r = el.getBoundingClientRect(); S.busy = false; done(r); }, t1 + 200);
}

    .onfinish = () => { if (S.pid !== problemId || S.step !== stepId) return; S.busy = false; done(); };

/* FLIP com física: mede onde cada peça estava, muda o estado, e anima até o lugar novo */
function flip(mut, hints){
  hints = hints || {};
  const before = {};
  if (!reduced) stage.querySelectorAll('[data-pid]').forEach(el => { if (!anims.has(el.dataset.pid)) before[el.dataset.pid] = el.getBoundingClientRect(); });
  mut();
  render();
  if (reduced) return;
  stage.querySelectorAll('[data-pid]').forEach(el => {
    const pid = el.dataset.pid, h = hints[pid];
    if (h){ startAnim(el, h.rect || before[pid] || null, h.type || 'toss', h); return; }
    const b = before[pid]; if (!b) return;
    const f = el.getBoundingClientRect();
    const dx = (b.left + b.width / 2) - (f.left + f.width / 2), dy = b.bottom - f.bottom;
    if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
    startAnim(el, b, (Math.abs(dx) < 2 && dy < -2) ? 'fall' : 'spring', {});
  });
}
/* a barra da bandeja pode estar deitada (celular em pé): a peça nova nasce em pé, no centro dela */
function uprightRect(r){
  if (!r || r.width <= r.height) return r;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, w = r.height;
  return { left:cx - w / 2, top:cy - w * 5, width:w, height:w * 10, bottom:cy + w * 5 };
}

/* ---------- fluxo do jogo ---------- */
function startLevel(lv){ S.level = lv; S.screen = 'game'; newProblem(); }
function newProblem(silent){
  let a, b, k, i = 0;
  do { [a, b] = gen(S.level); k = a + '+' + b; } while (k === S.lastKey && ++i < 20);
  S.lastKey = k; S.a = a; S.b = b; S.pid++;
  S.Z = { M:emptyZ(), A:emptyZ(), B:emptyZ() }; S.jk = null;
  enterStep(1, silent);
}
function enterStep(n, silent){
  if (!silent && S.screen === 'game' && stage.querySelector('.scene')) leaveScene(() => doEnter(n, silent));
  else doEnter(n, silent);
}
function doEnter(n, silent){
  S.step = n; S.msg = null; S.tries = 0; S.built = false; S.layout = ''; S.grouping = false;
  clearTimeout(S.countTimer);
  anims.clear();
  if (n <= 2) S.Z.M = emptyZ();
  if (n === 3){ S.ready3 = false; S.countShown = false; S.fullPrompted = false; S.ans = { t:null, u:null }; S.wrongBtn = null; S.jk = null; }
  if (n === 4){ S.opts = makeOptions(S.a, S.b); S.optBad = []; S.solved = false; }
  render();
  enterFX(n === 3 ? 'join' : n === 4 ? 'sum' : 'build');
  if (silent) return;
  if (n === 1) say(`Monte o número ${ext(S.a)}. Arraste as barras de dez e os cubinhos para o quadro.`);
  if (n === 2) say(`Agora monte o número ${ext(S.b)}.`);
  if (n === 3) say('Agora vamos juntar! Passe as peças de um quadro para o outro, até ficar tudo num quadro só.');
  if (n === 4) say(`Quanto é ${ext(S.a)} mais ${ext(S.b)}? Arraste a resposta até a caixa.`);
}
function goHome(){
  cancelDrag(); document.querySelectorAll('.ghost').forEach(el => el.remove()); S.pid++; S.busy = false; S.grouping = false;
  S.screen = 'home'; S.step = 0; S.msg = null; clearTimeout(S.countTimer); anims.clear();
  window.BlockVoice?.stop();
  render();
  if (!reduced) stage.querySelectorAll('.lv').forEach((el, i) => el.animate([{ transform:'translateY(24px) scale(.95)', opacity:0 }, { transform:'none', opacity:1 }], { duration:500, delay:i * 70, easing:'cubic-bezier(.2,1.3,.4,1)', fill:'backwards' }));
}

/* etapa 1 e 2: montar */
function addPiece(kind, origin, viaDrop){
  const z = S.Z.M, c = tcol();
  if (kind === 'ten'){
    if (z.tens.length >= capT()){ S.msg = { kind:'no', text:'Não cabe mais nenhuma barra aqui!' }; sfx('no'); say('Não cabe mais nenhuma barra.'); render(); shakeEl(stage.querySelector('[data-drop="M"]'), 5); return false; }
    const p = mk('ten', Array(10).fill(c));
    S.msg = null;
    flip(() => z.tens.push(p), { [p.id]:{ rect:uprightRect(origin), type:'toss', apex:viaDrop ? .9 : 2.6 } });
  } else {
    if (z.ones.length >= 9 && z.tens.length >= capT()){ S.msg = { kind:'no', text:'Não cabe mais nada aqui!' }; sfx('no'); render(); shakeEl(stage.querySelector('[data-drop="M"]'), 5); return false; }
    const p = mk('one', [c]);
    const h = { rect:origin, type:'toss', apex:viaDrop ? 1 : 2.8 };
    S.msg = null;
    if (z.ones.length + 1 >= 10){
      S.grouping = true;
      h.onLand = () => setTimeout(autoGroup, 160);
      setTimeout(autoGroup, reduced ? 30 : 1600);
    }
    flip(() => z.ones.push(p), { [p.id]:h });
  }
  return true;
}
function autoGroup(){
  if (S.screen !== 'game' || S.step < 1 || S.step > 2) return;
  if (S.Z.M.ones.length < 10){ S.grouping = false; return; }
  if (S.busy || (D && D.on)){ setTimeout(autoGroup, 300); return; }
  const col = stage.querySelector('[data-drop="M"] .ucol');
  fuse(col, rect => {
    const z = S.Z.M; if (z.ones.length < 10) return;
    const p = mk('ten', z.ones.slice(0, 10).map(x => x.colors[0]));
    S.flash = p.id; S.grouping = false;
    S.msg = { kind:'info', text:'10 unidades formam 1 dezena! Os cubinhos viraram uma barra.' };
    flip(() => { z.ones.splice(0, 10); z.tens.push(p); }, { [p.id]:{ rect, type:'toss', apex:3, heavy:true, onLand:rodCelebrate } });

    case 'opt':
      if (ok) tryOpt(+d.el.dataset.val, g, d.el);
      else settleGhost(g, d.el, () => { d.el.classList.remove('lifted'); });
      break;
    default: g.remove(); render();
  }
}
stage.addEventListener('pointerdown', onDown);
// Keyboard operation stays available alongside the original drag interaction.
stage.addEventListener('keydown', e => {
  if (!['Enter',' '].includes(e.key) || S.busy || S.grouping) return;
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault(); unlockAudio();
  if (el.dataset.drag === 'opt'){
    const g = el.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g);
    const r = el.getBoundingClientRect(); g.style.transform = `translate(${r.left}px,${r.top}px)`;
    tryOpt(+el.dataset.val, g, el);
  } else tap({el,type:el.dataset.drag,pid:el.dataset.pid,k:el.dataset.k});
});

/* ---------- botões ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if ((S.busy || S.grouping) && act !== 'sound' && act !== 'repeat' && act !== 'home') return;
  unlockAudio();
  switch (act){
    case 'level': startLevel(b.dataset.lv); break;
    case 'home': S.busy = false; goHome(); break;
    case 'repeat': say(S.lastSay); popEl(b, .15); break;
    case 'sound': S.sound = !S.sound; if (!S.sound) window.BlockVoice?.stop(); renderTop(); break;
    case 'voice-test': S.sound = true; renderTop(); say('Vamos brincar de somar? Arraste os blocos com calma. Você pode ouvir de novo quando quiser.'); break;
    case 'undo': {
      const pieces = [...S.Z.M.tens, ...S.Z.M.ones].sort((a,b) => +b.id.slice(1) - +a.id.slice(1));
      if (pieces[0]) { removePiece(pieces[0].id); sfx('pop'); }
      break;
    }
    case 'check': checkBuild(); break;
    case 'next-step': nextStep(); break;
    case 'ans': answer(b.dataset.k, +b.dataset.n); break;
    case 'to4': enterStep(4); break;
    case 'new': newProblem(); break;
  }
});

/* ---------- início ---------- */
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ level:S.level, score:S.score, sound:S.sound, screen:S.screen })); } catch(e){}
function boot(data){
  data = data || {};
  if (typeof data.score === 'number') S.score = data.score;
  if (data.sound === false) S.sound = false;
  if (data.screen === 'game' && data.level && LEVELS[data.level]){ S.level = data.level; S.screen = 'game'; newProblem(true); }
  else goHome();
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
})();
</script>
