<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trio do Saber</title>
  </head>
  <body>
    <p>Os exercícios de fono agora estão no aplicativo DinoFala para iOS.</p>
    <p><a href="../">Voltar aos jogos do Trio do Saber</a></p>
    <script>
      // Replace the old offline worker before leaving bookmarked or installed URLs.
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
          }
        } catch (error) {
          // Returning to the games also works when service workers are unavailable.
        } finally {
          location.replace('../');
        }
      })();
    </script>
  </body>
</html>
